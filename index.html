<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Student Builder Groups</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="navbar">
      <div class="brand">
        <span class="logo">☁️</span>
        <h1>AWS Student Builder Groups</h1>
      </div>
      <div class="user-status">
        <span id="user-display">Guest User</span>
        <button id="logout-btn" class="btn btn-secondary hidden" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="main-content">
      <!-- Authentication Card -->
      <section id="auth-section" class="card">
        <div class="tab-header">
          <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">Login</button>
          <button id="tab-signup-btn" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="auth-form">
          <h2>Member Login</h2>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" required placeholder="student@example.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-pass" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
          <p class="form-footer">
            <a href="#" onclick="switchTab('forgot'); return false;">Forgot Password?</a>
          </p>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" onsubmit="handleSignup(event)" class="auth-form hidden">
          <h2>Create Account</h2>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="signup-email" required placeholder="student@example.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-pass" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-form" onsubmit="handleForgot(event)" class="auth-form hidden">
          <h2>Reset Password</h2>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="forgot-email" required placeholder="student@example.com">
          </div>
          <button type="submit" class="btn btn-primary">Send Reset Link</button>
          <p class="form-footer">
            <a href="#" onclick="switchTab('login'); return false;">Back to Login</a>
          </p>
        </form>
      </section>

      <!-- Main Chat Area (Members Only) -->
      <section id="chat-section" class="card hidden">
        <div class="chat-header">
          <h2>Club Member Chatbot</h2>
          <span class="badge" id="doc-badge">Docs Loaded (8/8)</span>
        </div>

        <!-- Document Manager Section -->
        <div class="doc-manager">
          <h3>📄 Add Custom Document / Text</h3>
          <input type="text" id="doc-title-input" placeholder="e.g. event-briefing.md">
          <textarea id="doc-content-input" placeholder="Paste document text/notes here..."></textarea>
          
          <div class="upload-box">
            <label for="pdf-upload"><strong>Or Upload Text File (.txt/.md):</strong></label>
            <input type="file" id="pdf-upload" accept=".txt,.md" onchange="handleFileUpload(event)">
          </div>

          <button type="button" onclick="addCustomDocument()" class="btn btn-primary" style="margin-top:10px;">Publish Document</button>
        </div>

        <!-- Chat Output Box -->
        <div id="chat-box" class="chat-box">
          <div class="message bot-message">
            Hello! Ask me any question about the club, workshops, rules, or AWS setups.
          </div>
        </div>

        <form id="chat-form" onsubmit="handleChat(event)" class="chat-input-container">
          <input type="text" id="chat-input" placeholder="e.g. Who is Reshma?" required autocomplete="off">
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
